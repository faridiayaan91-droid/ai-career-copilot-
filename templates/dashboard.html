{% extends "base.html" %}
{% block content %}

<p class="welcome">Welcome, {{ user }} 👋</p>

<div class="card">
    <h3>📄 Resume Analyser</h3>
    <form id="analyzeForm" enctype="multipart/form-data">
        <textarea name="resume" placeholder="Paste your resume here (optional)"></textarea>

        <div class="dropzone" id="dropzone">
            📎 Drag & drop resume yahan, ya click karke chuno (PDF / DOCX)
            <input type="file" name="file" id="fileInput" accept=".pdf,.docx">
            <div class="file-name" id="fileName"></div>
        </div>

        <input type="text" name="role" placeholder="What do you want to become? (e.g. Backend Engineer)" required>
        <button type="submit" id="analyzeBtn">🔍 Analyse</button>
    </form>
</div>

<div class="spinner" id="spinner"></div>
<p id="loadingText" style="display:none; text-align:center; color: var(--muted);">
    AI tumhara resume analyse kar raha hai... 5-10 second lagenge
</p>

<div id="errorBox"></div>
<div id="resultBox"></div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<style>
    .auth-container {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 40px;
        padding: 0 15px;
    }
    .auth-card {
        width: 100%;
        max-width: 420px;
        background: white;
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.08);
    }
    .auth-card h2 {
        margin-bottom: 5px;
        font-size: 22px;
    }
    .sub-text {
        color: #666;
        font-size: 14px;
        margin-bottom: 20px;
    }
    .auth-card input {
        width: 100%;
        padding: 12px;
        margin-top: 12px;
        border-radius: 8px;
        border: 1px solid #ddd;
        font-size: 15px;
    }
    .auth-card input:focus {
        border-color: #2563eb;
        outline: none;
    }
    .auth-card button {
        width: 100%;
        margin-top: 18px;
        padding: 13px;
        background: #111827;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
    }
    .auth-card button:hover {
        background: #2563eb;
    }
    .switch-auth {
        text-align: center;
        margin-top: 15px;
        font-size: 14px;
        color: #666;
    }
    .switch-auth a {
        color: #2563eb;
        text-decoration: none;
    }
</style>
<div class="auth-container">
    <div class="auth-card">
        <h2>Create Account 🚀</h2>
        <p class="sub-text">Start your AI career journey</p>
        <form method="post">
            <input type="email" name="email" placeholder="Enter your email" required>
            <input type="password" name="password" placeholder="Create a password" required>
            <p class="sub-text">Use atleast 6 characters</p>
            <button type="submit">Sign Up</button>
        </form>
        <p class="switch-auth">
            Already have an account? <a href="/login">Login</a>
        </p>
    </div>
</div>
{% endblock %}
